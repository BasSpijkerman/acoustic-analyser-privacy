<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Analyser - Real-Time Audio Measurement</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--background);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            color: var(--text-main);
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        p.sub {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        nav {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            display: inline-block;
            padding: 12px 24px;
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s ease;
            background-color: var(--surface);
        }

        nav a:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .footer {
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Acoustic Analyser</h1>
        <p class="sub">Precise, real-time audio and spectrum analysis for iOS.</p>
        
        <nav>
            <a href="privacy.html">Privacy Policy</a>
            <a href="support.html">Support</a>
        </nav>
        
        <div class="footer">
            &copy; <script>document.write(new Date().getFullYear());</script> Bas Spijkerman
        </div>
    </div>
</body>
</html>
